name: Feature request
description: Suggest a new feature, test section, or enhancement
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: "What problem does this solve?"
      description: "Describe the use case or pain point. Real-world examples are best."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution"
      description: "What should the new test section or behavior look like?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
  - type: textarea
    id: extra
    attributes:
      label: "Additional context"
